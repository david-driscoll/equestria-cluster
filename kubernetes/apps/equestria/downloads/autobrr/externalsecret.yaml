---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # Every dataFrom below carries an explicit sourceRef, so this default store
  # was never consulted — it named onepassword-connect purely by inheritance
  # from the template it was copied from. Pointing it at the store actually in
  # use removes a phantom 1Password dependency that Phase 11 would otherwise
  # have to chase down.
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        # AUTOBRR__DATABASE_TYPE: postgres
        # AUTOBRR__POSTGRES_HOST: "{{ .postgres_hostname }}"
        # AUTOBRR__POSTGRES_PORT: "{{ .postgres_port }}"
        # AUTOBRR__POSTGRES_DATABASE: "{{ .postgres_database }}"
        # AUTOBRR__POSTGRES_USER: "{{ .postgres_user }}"
        # AUTOBRR__POSTGRES_PASS: "{{ .postgres_password }}"
        # AUTOBRR__POSTGRES_SSLMODE: "disable"
        AUTOBRR__OIDC_ENABLED: "true"
        AUTOBRR__OIDC_ISSUER: "{{ .oidc_issuer }}"
        AUTOBRR__OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        AUTOBRR__OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        AUTOBRR__OIDC_REDIRECT_URL: "https://${APP}.${ROOT_DOMAIN}/api/auth/oidc/callback"
        AUTOBRR__OIDC_DISABLE_BUILT_IN_LOGIN: "true"
  dataFrom:
    # - extract:
      #   key: '${APP}-postgres'
      # sourceRef:
      #   storeRef:
      #     kind: ClusterSecretStore
      #     name: database
      # rewrite:
      #   - regexp:
      #       source: "[\\W]"
      #       target: _
      #   - regexp:
      #       source: "(.*)"
      #       target: "postgres_$1"
    - extract:
        key: '${APP}-oidc-credentials'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: cluster
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
