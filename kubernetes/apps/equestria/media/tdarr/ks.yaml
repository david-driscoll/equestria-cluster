---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &name tdarr
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *name
    driscoll.dev/name: *name
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *name
      driscoll.dev/name: *name
  dependsOn:
    - name: volsync
      namespace: volsync-system
  path: ./kubernetes/apps/equestria/media/tdarr
  prune: true
  # Blanket protection for the piece 21 migration sweep: a Kustomization
  # ownership change must never cascade-delete live resources. Removed
  # again on the home-operations side once each namespace has landed.
  # See docs/cluster-consolidation/27-migration-churn-failure-modes.md.
  deletionPolicy: Orphan
  wait: true
  force: false
  interval: 1h
  timeout: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *name
      NAMESPACE: *namespace
