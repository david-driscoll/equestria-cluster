---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: meilisearch
spec:
  interval: 1h
  url: https://meilisearch.github.io/meilisearch-kubernetes
---
# HelmRelease for standalone MeiliSearch (broken out from karakeep)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: meilisearch
spec:
  chart:
    spec:
      chart: meilisearch
      version: 0.35.0
      sourceRef:
        kind: HelmRepository
        name: meilisearch
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    auth:
      existingMasterKeySecret: meilisearch-env
    fullnameOverride: meilisearch
    envFrom:
      - secretRef:
          name: meilisearch-env
    # NOTE: this chart's key is `environment:` (rendered into the
    # meilisearch-environment ConfigMap and consumed via envFrom), NOT `env:`.
    # The previous `env:` block was silently ignored by the chart — see vault#102.
    environment:
      MEILI_NO_ANALYTICS: "true"
      # One-way on-startup DB migration 1.47.0 -> 1.51.0. See vault#102.
      MEILI_UPGRADE_DB: "true"
      # Left at the chart default rather than "production": production mode
      # requires a >=16 byte MEILI_MASTER_KEY, and meilisearch-env currently
      # resolves MEILI_MASTER_KEY to an empty string, so production would
      # refuse to boot. Tracked separately — see vault#102.
      MEILI_ENV: "development"

    persistence:
      enabled: true
      storageClass: longhorn

    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
