---
# NOTE: this whole file is commented out of ./kustomization.yaml and has no
# live counterpart in the cluster — the equestria-namespace `tailscale-oauth`
# Secret does not exist. Converted with the rest of Phase 6 only so that no
# OnePasswordItem manifest is left behind to be re-adopted later.
#
# The live copy of this credential is
# kubernetes/apps/tailscale-system/operator/tailscale.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-oauth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: tailscale-oauth
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
  dataFrom:
    - extract:
        # was: vaults/Eris/items/Eris Tailscale OAuth Operator
        key: shared/eris-tailscale-oauth-operator
      # "valid from" carries a space, which is not a legal Secret key.
      rewrite:
        - regexp:
            source: "[^-._a-zA-Z0-9]"
            target: "-"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-update-token-sa
  namespace: equestria
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: equestria
  name: tailscale-secret-manager
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-bind-secret-manager
  namespace: equestria
subjects:
- kind: ServiceAccount
  name: tailscale-update-token-sa
  namespace: equestria
roleRef:
  kind: Role
  name: tailscale-secret-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: update-oauth-token-once
spec:
  template:
    spec:
      serviceAccountName: tailscale-update-token-sa
      containers:
      - name: update-token
        image: alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
        env:
        - name: OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: tailscale-oauth
              key: username
        - name:  OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: tailscale-oauth
              key: credential
        command:
        - /bin/sh
        - -c
        - |
          response=$(curl -d "client_id=$OAUTH_CLIENT_ID" -d "client_secret=$OAUTH_CLIENT_SECRET" "https://api.tailscale.com/api/v2/oauth/token")
          access_token=$(echo $response | jq -r '.access_token')
          kubectl create secret generic tailscale-access-token --from-literal=token="$access_token" --dry-run=client -o yaml | kubectl apply -f -
      restartPolicy: OnFailure
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: update-oauth-token
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: tailscale-update-token-sa
          containers:
          - name: update-token
            image: alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
            env:
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: username
            - name:  OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: credential
            command:
            - /bin/sh
            - -c
            - |
              response=$(curl -d "client_id=$OAUTH_CLIENT_ID" -d "client_secret=$OAUTH_CLIENT_SECRET" "https://api.tailscale.com/api/v2/oauth/token")
              access_token=$(echo $response | jq -r '.access_token')
              kubectl create secret generic access-token --from-literal=token="$access_token" --dry-run=client -o yaml | kubectl apply -f -
          restartPolicy: OnFailure
