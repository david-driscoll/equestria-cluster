---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app equestria-secrets
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # Phase 6: these are ExternalSecrets against ClusterSecretStore/openbao now,
    # not OnePasswordItem CRs, so the gate is the store rather than Connect.
    # (external-secrets-stores itself still dependsOn onepassword-connect until
    # Phase 11, so nothing is ordered any earlier than before.)
    - name: external-secrets-stores
      namespace: kube-system
  path: ./kubernetes/apps/equestria/shared/secrets
  prune: true
  # Blanket protection for the piece 21 migration sweep: a Kustomization
  # ownership change must never cascade-delete live resources. Removed
  # again on the home-operations side once each namespace has landed.
  # See docs/cluster-consolidation/27-migration-churn-failure-modes.md.
  deletionPolicy: Orphan
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
