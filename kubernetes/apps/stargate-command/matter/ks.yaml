---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app matter
  namespace: &namespace stargate-command
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/stargate-command/matter
  prune: true
  # Blanket protection for the piece 21 migration sweep: a Kustomization
  # ownership change must never cascade-delete live resources. Removed
  # again on the home-operations side once each namespace has landed.
  # See docs/cluster-consolidation/27-migration-churn-failure-modes.md.
  deletionPolicy: Orphan
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: sgc-secrets
      namespace: *namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 4Gi
      # Tier-1 (piece 12 Group B): the Matter/Thread bridge must survive
      # low-power mode. Migrated 2026-08-19, same choreography as
      # home-assistant.
      VOLSYNC_STORAGECLASS: longhorn-critical
