---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app network-secrets
  namespace: &namespace network
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # Phase 6: this path holds ExternalSecrets against ClusterSecretStore/openbao
    # now, not OnePasswordItem CRs, so the gate is the store rather than Connect.
    # external-secrets-stores itself still dependsOn onepassword-connect until
    # Phase 11, so nothing is ordered any earlier than before.
    - name: external-secrets-stores
      namespace: kube-system
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/network/secrets
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
