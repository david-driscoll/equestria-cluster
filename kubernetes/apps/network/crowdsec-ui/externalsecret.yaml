---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        TZ: "${TIMEZONE}"
        CONFIG_UI_TIME_ZONE: "${TIMEZONE}"

        # ---- LAPI connection -----------------------------------------
        # Watcher machine, registered by the init container in helmrelease.yaml
        # against the LAPI's auto_registration endpoint. An explicit named
        # machine with a known credential is easier to rotate and to audit than
        # a shared registration token, and it shows up in `cscli machines list`.
        CONFIG_INSTANCE_NAME: "${CLUSTER_TITLE}"
        CONFIG_INSTANCE_LAPI_URL: "http://crowdsec-service.network.svc.cluster.local:8080"
        CONFIG_INSTANCE_LAPI_AUTH_TYPE: "password"
        CONFIG_INSTANCE_LAPI_AUTH_USERNAME: "crowdsec-web-ui"
        CONFIG_INSTANCE_LAPI_AUTH_PASSWORD: "{{ .webui_password }}"

        # ---- Authentication ------------------------------------------
        # MUST be set explicitly. The default is `auto`, which only enables
        # authentication for NEW databases -- upstream warns that installations
        # migrated from releases that predate authentication stay
        # unauthenticated until this is turned on. Getting it wrong yields an
        # unauthenticated security console that can issue and revoke bans.
        CONFIG_AUTH_ENABLED: "true"
        CONFIG_AUTH_OIDC_ISSUER_URL: "{{ .oidc_issuer }}"
        CONFIG_AUTH_OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        CONFIG_AUTH_OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        CONFIG_AUTH_OIDC_SCOPE: "openid profile email"
        CONFIG_AUTH_OIDC_GROUPS_CLAIM: "groups"
        CONFIG_AUTH_OIDC_ADMIN_GROUPS_0: "admins"
        # Anyone Authentik lets through who is not in `admins` gets nothing.
        # Upstream's default is already `deny`; pinned explicitly because the
        # cost of that default ever changing is an outsider with ban controls.
        CONFIG_AUTH_OIDC_UNMATCHED_ROLE: "deny"
        # `auth.sessionSecret` is deliberately NOT supplied: the app generates
        # and stores one in /app/data, which is a volsync-backed PVC.
  dataFrom:
    # No rewrite, same convention as the crowdsec app's ExternalSecret: the
    # 1Password field name IS the template key name. Consumes the `webui_password`
    # field of the shared 'Crowdsec ApiKey' item.
    - extract:
        key: 'Crowdsec ApiKey'
    - extract:
        key: '${APP}-oidc-credentials'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: cluster
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
