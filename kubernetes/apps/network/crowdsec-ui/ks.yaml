---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app crowdsec-ui
  namespace: &namespace network
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # crowdsec's ks.yaml is wait: true, so this only starts once the LAPI is
    # actually Ready -- the init container below registers a watcher against it.
    - name: crowdsec
      namespace: network
    - name: external-secrets
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
  path: ./kubernetes/apps/network/crowdsec-ui
  prune: true
  force: false
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../components/failover/fast-node-eviction
    - ../../../components/tailscale
    - ../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      # SQLite plus the GeoNames snapshot plus crowdsec.sync.lookback (168h of
      # alert history) is the size driver.
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # The image runs as the `node` user (1000:1000); the restic mover has to
      # match or it cannot read what it is backing up.
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
