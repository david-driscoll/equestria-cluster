---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app crowdsec
  namespace: &namespace network
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  # D5: previously absent. The LAPI keeps all of its state in the shared CNPG
  # cluster and its Helm values Secret is rendered by external-secrets, so both
  # have to be up before this can succeed.
  dependsOn:
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/network/crowdsec
  # D4: the ../../../components/postgres component is `resources: []` -- it only
  # re-stamps the two labels commonMetadata already applies. Dropped rather than
  # left in place implying the Database CR comes from here; it is declared in
  # kubernetes/apps/database/postgres/app/users.yaml.
  prune: true
  # D5: wait: true so crowdsec-ui can dependsOn this and get a real readiness
  # signal instead of "the HelmRelease object exists".
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
