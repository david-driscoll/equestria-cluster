---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: crowdsec
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.24.0
    digest: sha256:a2c4fbf4f4692d9fca09d51d102c7e417fbe93b609356c4777f9cc31cb202458
  url: oci://ghcr.io/crowdsecurity/helm-charts/crowdsec
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: network
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  valuesFrom:
    - kind: Secret
      name: ${APP}-values
      valuesKey: values.yaml
  # Inline rather than in the values Secret on purpose. It contains no secrets,
  # and the chart hard-fails template rendering when neither `acquisition` nor
  # `additionalAcquisition` is set (agent-daemonSet.yaml). Keeping it here means
  # `flate test` -- which cannot resolve valuesFrom Secrets -- can still render
  # this release. spec.values deep-merges over valuesFrom, so the rest of
  # `agent:` still comes from the Secret.
  values:
    agent:
      acquisition:
        - namespace: network
          podName: traefik-*
          program: traefik
