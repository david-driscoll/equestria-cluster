---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${APP}-secret"
spec:
  refreshInterval: 4m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: "${APP}-volsync-secret"
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        RESTIC_REPOSITORY: "s3:https://{{ .backblaze_hostname }}/{{ .backblaze_bucket }}/${APP}"
        RESTIC_PASSWORD: "{{ .volsync_credential }}"
        AWS_ACCESS_KEY_ID: "{{ .backblaze_username }}"
        AWS_SECRET_ACCESS_KEY: "{{ .backblaze_credential }}"
  dataFrom:
    # Split source on purpose. The restic password has migrated to OpenBao, but
    # the Backblaze credential below has NOT — B2 is excluded from the migration
    # (estate decision 2026-08-07) — so this ExternalSecret keeps
    # onepassword-connect as its default store and only this reference is
    # redirected. Flipping secretStoreRef instead would silently take the
    # Backblaze extract with it and break the repository URL.
    - extract:
        # was: 'Volsync Password'
        key: shared/volsync-password
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: openbao
      rewrite:
        - regexp:
            source: "(.*)"
            target: "volsync_$1"
    - extract:
        key: '${BACKBLAZE_S3}'
      rewrite:
        - regexp:
            source: "(.*)"
            target: "backblaze_$1"
