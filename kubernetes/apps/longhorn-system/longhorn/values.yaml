---

# The dollars below are DOUBLED, which is the escape. configMapGenerator
# slurps this file whole and Flux postBuild envsubst then runs over the built
# output, comments included -- unescaped, this commented-out example put the
# real Spike IP and cluster name into the deployed ConfigMap. Halve them again
# when uncommenting.
# defaultBackupStore:
#   backupTarget: nfs://$${SPIKE_IP}:/mnt/stash/backup/$${CLUSTER_CNAME}/longhorn
  # backupTargetCredentialSecret: s3-secret
preUpgradeChecker:
  upgradeVersionCheck: false
persistence:
  defaultDataLocality: best-effort
defaultSettings:
  createDefaultDiskLabeledNodes: false
  defaultDataLocality: best-effort
  defaultLonghornStaticStorageClass: longhorn
  defaultReplicaCount: 2
  guaranteedInstanceManagerCpu: 5
  nodeDownPoddeletionPolicy: Delete-both-statefulset-and-deployment-pod
  volumeAttachmentRecoveryPolicy: never
  orphanAutoDeletion: true
  replicaAutoBalance: best-effort
  storageMinimalAvailablePercentage: 5
  storageReservedPercentageForDefaultDisk: 10
  autoCleanupSnapshotAfterOnDemandBackupCompleted: true
  autoCleanupSnapshotWhenDeleteBackup: true
  autoCleanupSystemGeneratedSnapshot: true
  autoCleanupRecurringJobBackupSnapshot: true
  removeSnapshotsDuringFilesystemTrim: true
  snapshotMaxCount: 5
  snapshotCountWarningThreshold: 4

  # backupTargetCredentialSecret: s3-secret
  defaultDataPath: /var/mnt/longhorn/
  storageOverProvisioningPercentage: 600
  upgradeChecker: true
  priorityClass: system-node-critical
  # taintToleration: key1=value1:NoSchedule; key2:NoExecute
  # systemManagedComponentsNodeSelector: "label-key1:label-value1"
  # disableSchedulingOnCordonedNode: false
  # replicaZoneSoftAntiAffinity: false
  # replicaDiskSoftAntiAffinity: false

  allowEmptyDiskSelectorVolume: true
  nodeDrainPolicy: block-for-eviction-if-contains-last-replica
ingress:
  enabled: true
  ingressClassName: internal
  host: "longhorn.${CLUSTER_DOMAIN}"
  annotations:
    reloader.stakater.com/auto: "true"
    external-dns.alpha.kubernetes.io/target: "${INTERNAL_DOMAIN}"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: network-local-user@kubernetescrd
metrics:
  serviceMonitor:
    enabled: true
