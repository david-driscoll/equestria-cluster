nameOverride: prometheus
ipFamilyPolicy: SingleStack
ipFamilies:
  - IPv4
cleanPrometheusOperatorObjectNames: true
alertmanager:
  enabled: false
kubeEtcd:
  service:
    selector:
      component: kube-apiserver # etcd runs on control plane nodes
kubeProxy:
  enabled: false
prometheus:
  annotations:
    reloader.stakater.com/auto: "true"
  # logLevel: debug
  priorityClassName: observability-critical
  route:
    main:
      enabled: true
      hostnames:
        - prometheus.${CLUSTER_DOMAIN}
      parentRefs:
        - name: internal
          namespace: network
          kind: Gateway
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authenticated-user
  thanosService:
    enabled: true
  thanosServiceMonitor:
    enabled: true
  prometheusSpec:
    scrapeInterval: 60s
    evaluationInterval: 60s
    externalUrl: https://prometheus.${CLUSTER_DOMAIN}
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 1d
    retentionSize: 16GB
    enableFeatures:
      - promql-experimental-functions
      - otlp-deltatocumulative
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        # cpu: 500m
        memory: 4Gi
    remoteWriteDashboards: true
    remoteWrite:
      - url: http://thanos-receive.observability.svc.cluster.local:19291/api/v1/receive
        queueConfig:
          maxSamplesPerSend: 10000
          batchSendDeadline: 5s
          minShards: 1
          maxShards: 4
        writeRelabelConfigs:
          # Prefer pod name as instance label for pod-level metrics
          - sourceLabels: [pod]
            regex: (.+)
            targetLabel: instance
            action: replace
          # Fall back to node name for node-level metrics (only when pod is empty)
          - sourceLabels: [node]
            separator: ";"
            regex: ";(.+)"
            targetLabel: instance
            action: replace
    externalLabels:
      cluster: ${CLUSTER_CNAME}
      cluster_title: ${CLUSTER_TITLE}
      environment: homelab
      region: ${LOCATION}
      machine_type: kubernetes
    tsdb:
      outOfOrderTimeWindow: 30m
    enableAdminAPI: true
    enableOTLPReceiver: true
    otlp:
      translationStrategy: NoUTF8EscapingWithSuffixes
      # Recommended attributes to be promoted to labels.
      promoteResourceAttributes:
        - service.instance.id
        - service.name
        - service.namespace
        - service.version
        - cloud.availability_zone
        - cloud.region
        - container.name
        - deployment.environment
        - deployment.environment.name
        - k8s.cluster.name
        - k8s.container.name
        - k8s.cronjob.name
        - k8s.daemonset.name
        - k8s.deployment.name
        - k8s.job.name
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.replicaset.name
        - k8s.statefulset.name
    alertingEndpoints:
      - name: alertmanager-operated
        namespace: observability
        port: http-web
        scheme: http
        apiVersion: v2
        pathPrefix: /
        timeout: 10s
    additionalAlertManagerConfigs:
      - scheme: http
        api_version: v2
        path_prefix: /
        timeout: 10s
        static_configs:
          - targets:
            - alertmanager-operated.observability.svc.cluster.local:9093
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources:
            requests:
              storage: 20Gi
prometheus-node-exporter:
  fullnameOverride: node-exporter
  # NOTE: Helm replaces lists rather than merging them, so the two
  # --collector.filesystem.* entries below MUST be repeated verbatim from
  # kube-prometheus-stack's own values.yaml. Dropping them would un-exclude
  # every container mount point and blow up filesystem-metric cardinality.
  # Keep them in sync when bumping the chart.
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    # AMD GPU metrics from /sys/class/drm/card*/device (node_drm_*). Disabled
    # upstream by default. amdgpu is the ONLY driver that publishes utilisation
    # through DRM sysfs — i915 does not, and is covered separately by
    # observability/intel-gpu-exporter (vault#110).
    #
    # Verified 2026-08-01 on both AMD nodes that the sysfs attributes the
    # collector reads are actually populated on these integrated parts:
    #   hard-hat       0x15bf (RDNA3 Phoenix) gpu_busy_percent, mem_info_vram_*,
    #   shining-armor  0x164e (RDNA2 Raphael) mem_info_gtt_*, mem_info_vis_vram_*
    # so this flag is not a silent no-op. Cardinality cost is ~8 series x 2 cards.
    - --collector.drm
  prometheus:
    monitor:
      enabled: true
      interval: 60s
      attachMetadata:
        node: true
      relabelings:
        - action: replace
          regex: (.*)
          replacement: $1
          sourceLabels: ["__meta_kubernetes_pod_node_name"]
          targetLabel: kubernetes_node
        - action: replace
          regex: (.*)
          replacement: $1
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance
kube-state-metrics:
  fullnameOverride: kube-state-metrics
  metricLabelsAllowlist:
    - pods=[*]
    - deployments=[*]
    - persistentvolumeclaims=[*]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: pulumi.com
              version: v1
              kind: Stack
            metricNamePrefix: kube_stack
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
            metrics:
              - name: status_condition
                help: "The current status conditions of a Pulumi Stack"
                each:
                  type: Gauge
                  gauge:
                    path: [status, conditions]
                    valueFrom: [status]
                    booleanValueTrue: "True"
                    booleanValueFalse: "False"
                    nilIsZero: true
                    labelsFromPath:
                      type: [type]
                      reason: [reason]
              - name: last_update_failures
                help: "Number of consecutive update failures for the Pulumi Stack"
                each:
                  type: Gauge
                  gauge:
                    path: [status, lastUpdate, failures]
                    nilIsZero: true
              - name: last_update_state
                help: "Current state of the last Pulumi Stack update (1=succeeded, 0=other)"
                each:
                  type: Gauge
                  gauge:
                    path: [status, lastUpdate, state]
                    nilIsZero: true
                    booleanValueTrue: "succeeded"
                    booleanValueFalse: "failed"
              - name: last_update_info
                help: "Pulumi Stack last update message info (used for lock detection)"
                each:
                  type: Info
                  info:
                    path: [status, lastUpdate]
                    labelsFromPath:
                      message: [message]
                      state: [state]
  prometheus:
    monitor:
      enabled: true
      relabelings:
        - action: replace
          regex: (.*)
          replacement: $1
          sourceLabels: ["__meta_kubernetes_pod_node_name"]
          targetLabel: kubernetes_node
kubelet:
  serviceMonitor:
    resourceInterval: 30s
    cAdvisorInterval: 30s
grafana:
  enabled: false
  forceDeployDashboards: true
